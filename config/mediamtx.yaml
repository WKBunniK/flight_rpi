# Приём H.264 от нашего FFmpeg.
rtsp: true
rtspAddress: 127.0.0.1:8554
rtspTransports: [tcp]

# Страница плеера и согласование WebRTC-соединения.
webrtc: true
webrtcAddress: 127.0.0.1:8889

# Передача видео через TCP, чтобы использовать SSH-проброс.
webrtcLocalUDPAddress: ""
webrtcLocalTCPAddress: 127.0.0.1:8189

# Браузер подключится к локальному порту SSH на ноутбуке.
webrtcIPsFromInterfaces: false
webrtcAdditionalHosts: ["127.0.0.1"]

rtmp: false
hls: false
srt: false
moq: false

writeQueueSize: 64

paths:
  camera:
    source: publisher